name: ros2机械臂装配最小模拟闭环
version: 0.1.0
mode: synthetic_cartesian_feedback
ros_distro_target: jazzy
ros_runtime_verified_locally: false
entrypoint:
  launch: ros2 launch axis_hole_bringup assembly_agent_demo.launch.py
packages:
  - axis_hole_bringup
  - assembly_trajectory_planner
  - compliant_servo_control
limitations:
  - no_image_or_pointcloud_processing
  - no_contact_physics_engine
  - no_coppeliasim_bridge
  - no_real_robot_driver
